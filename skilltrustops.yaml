version: 1
profile: recommended-v2
checks:
  lint:
    enabled: true
    ruleset: agent-skills-specification
  security:
    enabled: true
    secrets:
      enabled: true
      scanners:
        - engine: builtin
          enabled: true
    dangerous_code:
      enabled: true
      engine: ast
      block_eval: true
      block_destructive_shell: true
      block_remote_pipe: true
  privacy:
    enabled: true
    pii:
      enabled: true
      engine: builtin
      entities:
        - email
        - phone
        - ssn
        - credit_card
redteam:
  sandbox:
    provider: docker
    image: alpine:3.20
    timeout_seconds: 90
    pids_limit: 64
    memory: 256m
    cpus: 1.0
    user_id: 65532
    group_id: 65532
    tmpfs_size_mb: 16
