[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skilltrustops"
version = "0.1.0"
description = "Local-first trust and certification tooling for AI agent skills"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SkillTrustOps contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "types-pyyaml>=6.0.12.20240808",
]

[project.scripts]
skilltrustops = "skilltrustops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltrustops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["skilltrustops"]
mypy_path = "src"
