[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skilltrustops"
version = "0.1.4"
description = "Local-first security scanning and behavioral testing for AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SkillTrustOps contributors" }]
keywords = ["agent-skills", "security", "static-analysis", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=13.7,<16",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.6,<1",
    "types-pyyaml>=6.0.12.20240808",
]
observability = ["opentelemetry-api>=1.27,<2"]

[project.scripts]
skilltrustops = "skilltrustops.cli:app"

[project.urls]
Homepage = "https://github.com/rakeshcheekatimala/skilltrustops"
Repository = "https://github.com/rakeshcheekatimala/skilltrustops"
Issues = "https://github.com/rakeshcheekatimala/skilltrustops/issues"
Changelog = "https://github.com/rakeshcheekatimala/skilltrustops/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltrustops"]

[tool.hatch.build.targets.sdist]
include = ["src/skilltrustops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["skilltrustops"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/skilltrustops/detectors/package.py" = ["E501"] # regex and remediation tables

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skilltrustops"]
mypy_path = "src"
