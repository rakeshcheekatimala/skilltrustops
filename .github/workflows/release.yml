name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - name: Scan Python source with Bandit
        run: uvx --from bandit==1.9.4 bandit -r src/skilltrustops -q
      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements-txt
          --output-file /tmp/skilltrustops-audit-requirements.txt
      - name: Audit locked dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --disable-pip --require-hashes --progress-spinner off
          --requirement /tmp/skilltrustops-audit-requirements.txt
      - run: uv build
      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - run: uv run python scripts/generate_sbom.py
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Attest distributions and SBOM
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*
            artifacts/skilltrustops.spdx.json
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
