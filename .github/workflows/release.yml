name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          expected_tag = f"v{metadata['project']['version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match "
                  f"package version {expected_tag!r}"
              )
          PY
      - run: uv run pytest
      - name: Scan Python source with Bandit
        run: uvx --from bandit==1.9.4 bandit -r src/skilltrustops -q
      - name: Export locked project dependencies
        run: >-
          uv export --locked --extra dev --no-emit-project
          --format requirements-txt
          --output-file /tmp/skilltrustops-all-requirements.txt
      - name: Audit locked runtime and development dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --disable-pip --require-hashes --progress-spinner off
          --requirement /tmp/skilltrustops-all-requirements.txt
      - run: uv build
      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - run: uv run python scripts/generate_sbom.py
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Attest distributions and SBOM
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*
            artifacts/skilltrustops.spdx.json
      - name: Collect signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets attestations
          cp dist/* artifacts/skilltrustops.spdx.json release-assets/
          cd attestations
          for subject in ../dist/* ../artifacts/skilltrustops.spdx.json; do
            gh attestation download "$subject" --repo "$GITHUB_REPOSITORY"
          done
          for attestation in ./*.jsonl; do
            safe_name="${attestation/:/-}"
            if [ "$attestation" != "$safe_name" ]; then
              mv "$attestation" "$safe_name"
            fi
          done
          cp ./*.jsonl ../release-assets/
      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-assets
          path: release-assets
      - name: Create signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
