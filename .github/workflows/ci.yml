name: CI

on:
  pull_request:
  push:
    branches: [main, library]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=skilltrustops --cov-report=term-missing --cov-report=xml
      - name: Upload coverage evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Scan Python source with Bandit
        run: uvx --from bandit==1.9.4 bandit -r src/skilltrustops -q
      - name: Export locked project dependencies
        run: >-
          uv export --locked --extra dev --no-emit-project
          --format requirements-txt
          --output-file /tmp/skilltrustops-all-requirements.txt
      - name: Audit locked runtime and development dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --disable-pip --require-hashes --progress-spinner off
          --requirement /tmp/skilltrustops-all-requirements.txt
      - run: uv run python scripts/check_docs.py
      - run: uv run python benchmarks/calibration/generate_dataset.py
      - run: uv run python benchmarks/calibration/evaluate.py
      - run: git diff --exit-code benchmarks/calibration
      - run: uv build
      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - run: uv run python scripts/generate_sbom.py
      - name: Upload package assurance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-assurance
          path: |
            dist/*
            artifacts/skilltrustops.spdx.json
          retention-days: 14

  required:
    name: CI required
    if: always()
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "success" ]; then
            exit 1
          fi
