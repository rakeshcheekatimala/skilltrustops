name: Snyk Security

on:
  pull_request:
  push:
    branches: [main, library]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Runtime dependencies
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Require Snyk authentication
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Add a repository secret named SNYK_TOKEN before relying on this gate."
            exit 1
          fi
      - name: Export the locked runtime dependency graph for Snyk
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --format requirements-txt
          --output-file /tmp/skilltrustops-snyk-requirements.txt
      - name: Snyk Open Source
        id: open_source
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          uv run --no-sync npx --yes snyk@1.1306.2 test
          --file=/tmp/skilltrustops-snyk-requirements.txt
          --package-manager=pip --command=python
          --severity-threshold=low
      - name: Register clean dependency snapshot for continuous monitoring
        if: steps.open_source.outcome == 'success' && github.event_name != 'pull_request'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          uv run --no-sync npx --yes snyk@1.1306.2 monitor
          --file=/tmp/skilltrustops-snyk-requirements.txt
          --package-manager=pip --command=python
      - name: Enforce Snyk Open Source gate
        if: always()
        env:
          OPEN_SOURCE_OUTCOME: ${{ steps.open_source.outcome }}
        run: |
          if [ "$OPEN_SOURCE_OUTCOME" != "success" ]; then
            echo "::error::Snyk Open Source did not pass."
            exit 1
          fi
